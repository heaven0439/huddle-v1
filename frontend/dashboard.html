<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huddle | Dashboard</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/main.css">
    <style>
        /* Premium Dashboard Layout */
        .dashboard-container { max-width: 1200px; margin: 0 auto; padding: 2rem; width: 100%; }

        .dashboard-layout {
            display: grid; grid-template-columns: 1fr 400px; gap: 4rem;
            margin-top: 3rem; align-items: start;
        }

        /* Left Side: Hero & Actions */
        .dashboard-hero { display: flex; flex-direction: column; gap: 1.5rem; }

        .time-display {
            font-size: 4rem; font-weight: 300; line-height: 1; letter-spacing: -0.05em;
            color: var(--text-main); margin-bottom: 0.5rem;
        }

        .date-display { color: var(--text-muted); font-size: 1.25rem; font-weight: 400; margin-bottom: 2rem; }

        .greeting {
            font-size: 2rem; font-weight: 600; margin-bottom: 2rem;
            background: linear-gradient(to right, #FAFAFA, #A1A1AA);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* Quick Action Bar */
        .action-bar {
            display: flex; flex-wrap: wrap; gap: 1rem;
            background: rgba(255, 255, 255, 0.02); border: 1px solid var(--border-color);
            padding: 1rem; border-radius: var(--radius-lg); align-items: center;
        }

        .btn-large { padding: 0.875rem 1.5rem; font-size: 1.05rem; }
        .join-wrapper { display: flex; gap: 0.5rem; flex: 1; min-width: 250px; }

        /* Right Side: Schedule Panel */
        .schedule-panel {
            background: linear-gradient(145deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.01) 100%);
            border: 1px solid var(--border-color); border-radius: var(--radius-lg);
            padding: 1.5rem; backdrop-filter: blur(10px); box-shadow: var(--shadow-md);
        }

        .panel-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border-color);
        }
        .panel-header h3 { font-size: 1.1rem; font-weight: 600; }

        /* Placeholder Meeting Item */
        .meeting-item {
            display: flex; align-items: center; justify-content: space-between; padding: 1rem;
            border-radius: var(--radius-md); background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent; transition: all var(--transition-fast); margin-bottom: 0.75rem;
        }
        .meeting-item:hover { border-color: var(--border-color); background: rgba(255, 255, 255, 0.05); }
        .meeting-time { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; width: 70px; }
        .meeting-details h4 { font-size: 0.95rem; font-weight: 500; color: var(--text-main); }
        .meeting-details p { font-size: 0.8rem; color: var(--text-faint); margin-top: 0.2rem; }

        /* Navbar tweaks */
        .user-profile { display: flex; align-items: center; gap: 0.5rem; }
        .avatar {
            width: 36px; height: 36px; background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: 600; color: white; box-shadow: 0 2px 8px var(--primary-glow);
            margin-right: 0.5rem;
        }
        
        /* Logout Button Icon Styling */
        .logout-icon-btn {
            padding: 0.5rem;
            color: var(--text-muted);
            border-radius: var(--radius-sm);
        }
        .logout-icon-btn:hover {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
        }

        @media (max-width: 968px) {
            .dashboard-layout { grid-template-columns: 1fr; gap: 2rem; }
            .action-bar { flex-direction: column; align-items: stretch; }
            .time-display { font-size: 3rem; }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar container" style="border-bottom: 1px solid var(--border-color);">
        <div class="brand">
            <div class="brand-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 7l-7 5 7 5V7z"></path>
                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                </svg>
            </div>
            Huddle
        </div>
        <div class="user-profile">
            <div class="avatar" id="user-avatar">?</div>
            <button class="btn btn-ghost logout-icon-btn" id="logout-btn" title="Log Out">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </button>
        </div>
    </nav>

    <!-- Main Dashboard Area -->
    <div class="dashboard-container">
        <div class="dashboard-layout">
            
            <!-- Left Column: Hero & Actions -->
            <div class="dashboard-hero">
                <div>
                    <div class="time-display" id="live-clock">00:00</div>
                    <div class="date-display" id="current-date">Loading date...</div>
                </div>
                
                <h1 class="greeting" id="user-greeting">Welcome back.</h1>
                
                <div class="action-bar">
                    <button class="btn btn-primary btn-large" id="create-meeting-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 8px;">
                            <path d="M23 7l-7 5 7 5V7z"></path>
                            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                        </svg>
                        New Meeting
                    </button>
                    
                    <div class="join-wrapper">
                        <input type="text" class="input-field" id="join-code-input" placeholder="Enter a code or link">
                        <button class="btn btn-secondary" id="join-btn">Join</button>
                    </div>
                </div>
            </div>

            <!-- Right Column: Schedule / History Widget -->
        
        </div>
    </div>

    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
